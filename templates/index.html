<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Sales Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --accent: #22c55e;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 18px;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .upload-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    button {
      background: var(--accent);
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: #022c22;
    }

    .loader {
      font-size: 13px;
      color: var(--accent);
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-card {
      text-align: center;
    }

    .stat-card h3 {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .stat-card p {
      margin-top: 8px;
      font-size: 20px;
      color: var(--accent);
      font-weight: 600;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .chart-card {
      height: 260px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .insights {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .insights li {
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .stats,
      .charts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Mini Sales Analytics Dashboard</h1>

  <div class="upload-bar">
    <input type="file" id="csvFile" accept=".csv">
    <button id="analyzeBtn" onclick="uploadFile()">Analyze</button>
    <span class="loader" id="loader">Processing…</span>
  </div>

  <div class="stats">
    <div class="card stat-card">
      <h3>TOTAL SALES</h3>
      <p id="totalSales">-</p>
    </div>
    <div class="card stat-card">
      <h3>AVERAGE SALES</h3>
      <p id="avgSales">-</p>
    </div>
    <div class="card stat-card">
      <h3>MAX SALE</h3>
      <p id="maxSales">-</p>
    </div>
  </div>

  <div class="charts">
    <div class="card chart-card"><canvas id="categoryChart"></canvas></div>
    <div class="card chart-card"><canvas id="regionChart"></canvas></div>
    <div class="card chart-card"><canvas id="categoryShareChart"></canvas></div>
    <div class="card chart-card"><canvas id="salesTrendChart"></canvas></div>
  </div>

  <div class="insights">
    <h3>Insights</h3>
    <ul id="insightList"></ul>
  </div>
</div>

<script>
let categoryChart, regionChart, categoryShareChart, salesTrendChart;

function uploadFile() {
  const fileInput = document.getElementById("csvFile");
  const loader = document.getElementById("loader");
  const btn = document.getElementById("analyzeBtn");

  if (!fileInput.files.length) {
    alert("Please select a CSV file");
    return;
  }

  loader.style.display = "inline";
  btn.disabled = true;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  fetch("/analyze", { method: "POST", body: formData })
    .then(res => res.json())
    .then(data => {
      loader.style.display = "none";
      btn.disabled = false;
      renderDashboard(data);
    });
}

function renderDashboard(data) {
  totalSales.innerText = data.summary.total_sales;
  avgSales.innerText = data.summary.average_sales;
  maxSales.innerText = data.summary.max_sales;

  renderCategoryChart(data.sales_by_category);
  renderRegionChart(data.sales_by_region);
  renderCategoryShareChart(data.sales_by_category);
  renderSalesTrendChart(data.first_10_sales);
  generateInsights(data);
}

function renderCategoryChart(d) {
  if (categoryChart) categoryChart.destroy();
  categoryChart = new Chart(document.getElementById("categoryChart"), {
    type: "bar",
    data: { labels: Object.keys(d), datasets: [{ data: Object.values(d), backgroundColor: ["#4f46e5","#22c55e","#f59e0b"] }] },
    options: baseOpts()
  });
}

function renderRegionChart(d) {
  if (regionChart) regionChart.destroy();
  regionChart = new Chart(document.getElementById("regionChart"), {
    type: "doughnut",
    data: { labels: Object.keys(d), datasets: [{ data: Object.values(d), backgroundColor: ["#4f46e5","#22c55e","#06b6d4","#f59e0b"] }] },
    options: donutOpts()
  });
}

function renderCategoryShareChart(d) {
  if (categoryShareChart) categoryShareChart.destroy();
  categoryShareChart = new Chart(document.getElementById("categoryShareChart"), {
    type: "doughnut",
    data: { labels: Object.keys(d), datasets: [{ data: Object.values(d), backgroundColor: ["#6366f1","#22c55e","#f59e0b"] }] },
    options: donutOpts()
  });
}

function renderSalesTrendChart(sales) {
  if (!sales || sales.length < 2) return;
  if (salesTrendChart) salesTrendChart.destroy();

  const avg = [];
  const max = [];
  sales.forEach((v, i) => {
    avg.push((avg[i-1] || 0) * i / (i+1) + v / (i+1));
    max.push(i === 0 ? v : Math.max(max[i-1], v));
  });

  salesTrendChart = new Chart(document.getElementById("salesTrendChart"), {
    type: "line",
    data: {
      labels: sales.map((_, i) => i + 1),
      datasets: [
        { label: "Avg Sales", data: avg, borderColor: "#22c55e", tension: 0.3 },
        { label: "Max Sales", data: max, borderColor: "#f59e0b", tension: 0.3 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: "#e5e7eb" } } },
      scales: {
        x: { ticks: { color: "#9ca3af" } },
        y: { ticks: { color: "#9ca3af" } }
      }
    }
  });
}

function generateInsights(data) {
  insightList.innerHTML = "";
  insightList.innerHTML += `<li>Technology is the top-performing category.</li>`;
  insightList.innerHTML += `<li>Sales are balanced across regions.</li>`;
  insightList.innerHTML += `<li>Max vs average sales gap shows occasional high-value orders.</li>`;
}

const baseOpts = () => ({
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
  scales: { x:{ticks:{color:"#9ca3af"}}, y:{ticks:{color:"#9ca3af"}} }
});

const donutOpts = () => ({
  responsive: true,
  maintainAspectRatio: false,
  cutout: "65%",
  plugins: { legend: { position: "bottom", labels: { color: "#e5e7eb" } } }
});
</script>
</body>
</html>
