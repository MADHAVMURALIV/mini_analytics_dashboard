<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Sales Analytics Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg:#0b1220; --card:#111827; --accent:#22c55e;
      --text:#e5e7eb; --muted:#9ca3af; --border:#1f2937;
    }
    [data-theme="light"] {
      --bg:#f4f6f8; --card:#ffffff; --accent:#2563eb;
      --text:#111827; --muted:#6b7280; --border:#e5e7eb;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    h1 { text-align: center; margin-bottom: 6px; }
    #dateTime { text-align:center; color:var(--muted); font-size:13px; margin-bottom:14px; }

    .container { max-width:1200px; margin:auto; }

    .top-bar {
      display:flex;
      justify-content:flex-end;
      margin-bottom:10px;
    }

    button, select, input {
      padding:8px 12px;
      border-radius:8px;
      border:1px solid var(--border);
    }

    button {
      background:var(--accent);
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    button.secondary {
      background:transparent;
      color:var(--text);
    }

    .upload-bar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      background:var(--card);
      padding:14px;
      border-radius:12px;
      border:1px solid var(--border);
      margin-bottom:20px;
    }

    .stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .charts {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
      margin-top:20px;
    }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
    }

    .stat-card { text-align:center; }
    .stat-card p { color:var(--accent); font-size:20px; font-weight:600; }

    .chart-card { height:260px; }
    canvas { width:100% !important; height:100% !important; }

    .insights { margin-top:20px; }
    .insights li { color:var(--muted); }

    /* processing anime */
    #processingOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #555;
      border-top: 6px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @media(max-width:900px){
      .stats,.charts{grid-template-columns:1fr;}
    }
  </style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <button class="secondary" onclick="toggleTheme()">Toggle Theme</button>
  </div>

  <h1>Mini Sales Analytics Dashboard</h1>
  <div id="dateTime"></div>

  <div class="upload-bar">
    <input type="file" id="csvFile" accept=".csv">
    <select id="regionFilter">
      <option value="All">All Regions</option>
      <option value="Central">Central</option>
      <option value="East">East</option>
      <option value="South">South</option>
      <option value="West">West</option>
    </select>
    <button onclick="uploadFile()">Analyze</button>
    <button class="secondary" onclick="downloadPDF()">Download PDF</button>
  </div>

  <div class="stats">
    <div class="card stat-card"><h4>Total Sales</h4><p id="totalSales">-</p></div>
    <div class="card stat-card"><h4>Average Sales</h4><p id="avgSales">-</p></div>
    <div class="card stat-card"><h4>Max Sale</h4><p id="maxSales">-</p></div>
  </div>

  <div class="charts">
    <div class="card chart-card"><canvas id="categoryChart"></canvas></div>
    <div class="card chart-card"><canvas id="regionChart"></canvas></div>
    <div class="card chart-card"><canvas id="categoryShareChart"></canvas></div>
    <div class="card chart-card"><canvas id="salesTrendChart"></canvas></div>
  </div>

  <div class="insights card">
    <h3>Insights</h3>
    <ul id="insightList"></ul>
  </div>
</div>

<div id="processingOverlay">
  <div class="spinner"></div>
  <p style="color:white;margin-top:12px;">Processing...</p>
</div>

<script>

let overlayStartTime = 0;

/* theme toggle */
function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
}
document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");

setInterval(()=>{ dateTime.innerText="Last updated: "+new Date().toLocaleString(); },1000);

let latestData = null;
let charts = [];

function uploadFile() {
  const file = csvFile.files[0];
  if (!file) { alert("Upload a CSV file"); return; }

  overlayStartTime = Date.now();
processingOverlay.style.display = "flex";


  const fd = new FormData();
  fd.append("file", file);
  fd.append("region", regionFilter.value);

  fetch("/analyze", { method:"POST", body:fd })
    .then(r=>r.json())
  .then(d=>{
  latestData = d;

  const elapsed = Date.now() - overlayStartTime;
  const minDelay = 800; // animation delay

  const remaining = Math.max(minDelay - elapsed, 0);

  setTimeout(() => {
    processingOverlay.style.display = "none";
    renderDashboard(d);
  }, remaining);
})

   .catch(e=>{
  const elapsed = Date.now() - overlayStartTime;
  const minDelay = 800;
  const remaining = Math.max(minDelay - elapsed, 0);

  setTimeout(() => {
    processingOverlay.style.display = "none";
    alert("Analysis failed");
    console.error(e);
  }, remaining);
});

}

function renderDashboard(d) {
  totalSales.innerText = d.summary.total_sales;
  avgSales.innerText = d.summary.average_sales;
  maxSales.innerText = d.summary.max_sales;

  charts.forEach(c=>c.destroy()); charts=[];

  charts.push(new Chart(categoryChart,{type:"bar",
    data:{labels:Object.keys(d.sales_by_category),
    datasets:[{data:Object.values(d.sales_by_category),backgroundColor:["#4f46e5","#22c55e","#f59e0b"]}]},
    options:{responsive:true,maintainAspectRatio:false}}));

  charts.push(new Chart(regionChart,{type:"doughnut",
    data:{labels:Object.keys(d.sales_by_region),
    datasets:[{data:Object.values(d.sales_by_region)}]},
    options:{responsive:true,maintainAspectRatio:false}}));

  charts.push(new Chart(categoryShareChart,{type:"doughnut",
    data:{labels:Object.keys(d.sales_by_category),
    datasets:[{data:Object.values(d.sales_by_category)}]},
    options:{responsive:true,maintainAspectRatio:false}}));

  const avg=[], max=[];
  d.first_10_sales.forEach((v,i)=>{
    avg.push((avg[i-1]||0)*i/(i+1)+v/(i+1));
    max.push(i?Math.max(max[i-1],v):v);
  });

  charts.push(new Chart(salesTrendChart,{type:"line",
    data:{labels:d.first_10_sales.map((_,i)=>i+1),
    datasets:[
      {label:"Avg Sales",data:avg,borderColor:"#22c55e"},
      {label:"Max Sales",data:max,borderColor:"#f59e0b"}
    ]},
    options:{responsive:true,maintainAspectRatio:false}}));

  insightList.innerHTML="";
  insightList.innerHTML+=`<li>Technology category leads overall sales.</li>`;
  insightList.innerHTML+=`<li>Sales are well distributed across regions.</li>`;
  insightList.innerHTML+=`<li>High max vs average indicates large-value transactions.</li>`;
}

/* pdf report */
async function downloadPDF() {
  if (!latestData) { alert("Analyze first"); return; }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  pdf.text("Sales Analytics Report",20,20);
  pdf.text(`Generated: ${new Date().toLocaleString()}`,20,30);
  pdf.text(`Total Sales: ${latestData.summary.total_sales}`,20,45);
  pdf.text(`Average Sales: ${latestData.summary.average_sales}`,20,55);
  pdf.text(`Max Sale: ${latestData.summary.max_sales}`,20,65);

  pdf.addPage();
  ["categoryChart","regionChart","categoryShareChart","salesTrendChart"].forEach((id,i)=>{
    const img = document.getElementById(id).toDataURL("image/png");
    pdf.addImage(img,"PNG",15,20+i*60,180,50);
  });

  pdf.save("sales_analytics_report.pdf");
}
</script>
</body>
</html>
