<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sales Analytics Dashboard</title>

  <style>
    :root {
      --bg: #05070c;
      --accent: #22c55e;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 70% 30%, rgba(34,197,94,0.15), transparent 40%),
        radial-gradient(circle at 30% 70%, rgba(99,102,241,0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero {
      text-align: center;
      z-index: 1;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 600;
      margin: 0 0 32px;
      letter-spacing: -0.5px;
    }

    .hero a {
      display: inline-block;
      padding: 14px 36px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      background: var(--accent);
      color: #022c22;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .hero a:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      animation: float 6s infinite ease-in-out;
    }

    .dot:nth-child(1) { top: 20%; left: 15%; }
    .dot:nth-child(2) { top: 70%; left: 25%; animation-delay: 2s; }
    .dot:nth-child(3) { top: 30%; left: 80%; animation-delay: 1s; }
    .dot:nth-child(4) { top: 65%; left: 75%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 32px; }
    }
  </style>
</head>

<body>

  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>

  <div class="hero">
    <h1>Sales Analytics Dashboard</h1>
    <a href="/dashboard">Open Dashboard</a>
  </div>

</body>
</html>
